<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    Coletta pictogram: 5 interlocking circles (Borromean rosette).
    Each circle goes OVER one neighbor and UNDER the other.
    stroke="currentColor" allows CSS color control (red/white).
  -->
  <defs>
    <!-- Clip to redraw circle 1's arc that goes OVER circle 5 -->
    <clipPath id="fix">
      <circle cx="31" cy="43.8" r="27"/>
    </clipPath>
  </defs>

  <g fill="none" stroke="currentColor" stroke-width="6.5" stroke-linecap="round">
    <!-- Draw order: 1-5, then fix circle 1 over circle 5 -->
    <circle cx="50"   cy="30"   r="22"/>  <!-- 1: top -->
    <circle cx="69"   cy="43.8" r="22"/>  <!-- 2: top-right -->
    <circle cx="61.8" cy="66.2" r="22"/>  <!-- 3: bottom-right -->
    <circle cx="38.2" cy="66.2" r="22"/>  <!-- 4: bottom-left -->
    <circle cx="31"   cy="43.8" r="22"/>  <!-- 5: top-left -->

    <!-- Fix: redraw circle 1 clipped to circle 5 intersection area -->
    <circle cx="50" cy="30" r="22" clip-path="url(#fix)"/>
  </g>
</svg>
